# Paneles que actualiza Lupa. Un solo link por panel: el oficial. No hay copias.
#
# modo: ensayo
#   - Paneles con `en_ensayo: comparar`: se generan en el repo (`archivo`) y se comparan
#     contra el oficial, SIN publicar. Las rutinas viejas siguen publicando ahí.
#   - Paneles con `en_ensayo: publicar`: son nuevos y Lupa es su única dueña; se publican
#     en su link desde el primer día.
# modo: oficial
#   - Todos se publican en su link (leyéndolo antes). Pasa en el paso 6, el mismo día en
#     que Joana pausa las rutinas viejas. Lo cambia Joana, no Lupa.
#
# NUNCA publicar en un link `comparar` mientras modo sea ensayo.

modo: ensayo

paneles:
  monitor_growth:
    nombre: Monitor de Growth
    link: https://claude.ai/artifact/3G7z5oWCzP6hjALXubjU1Y
    archivo: dashboard/index.html
    en_ensayo: comparar        # hoy lo publica la rutina "Agente Growth · Monitor y alarma diaria"
  panel_meta_ads:
    nombre: Panel Meta Ads
    link: https://claude.ai/artifact/GVEEa9pDVDPmV6Yzn7gS12
    archivo: meta/informes/panel-trimestral.html
    en_ensayo: comparar        # hoy lo publica la rutina de agente-meta-ads
  panel_redes:
    nombre: Panel de redes
    link: https://claude.ai/artifact/7CvY69B57dbuAACEgjHwr9   # creado el 08/10/2026, es el oficial
    archivo: redes/panel/index.html
    en_ensayo: publicar
