  estructura_medida:
    conjuntos_en_el_periodo: 32
    conjuntos_con_menos_de_3_anuncios: 28
    conjuntos_con_un_solo_anuncio: 19
    anuncios_distintos: 49
    anuncios_con_diagnostico_de_relevancia: 8
    nota: >
      El problema no es solo "pocos creativos": son 32 conjuntos para ~37
      leads/semana. Ninguno junta los ~50 eventos que necesita para salir del
      aprendizaje. La direccion correcta es la inversa: menos conjuntos, mas
      anuncios adentro de cada uno.

  creativo_dominante:
    nombre: "Video Jesi - Todo Movil (4 versiones)"
    gasto_ars: 2930288
    pct_de_la_cuenta: 41
    costo_por_resultado_ars: [3816, 5870, 11711, 12898]
    nota: "Mismo video, 3,4x de diferencia segun el conjunto donde corrio."

  presupuesto:
    diario_ars: PENDIENTE
    mensual_ars: PENDIENTE
    nota: "Gasto real ~1,15 M ARS/mes. Falta saber si es el presupuesto que Joana quiere sostener."
  mcp:
    disponible: true
    habilitado_el: "2026-09-11"
    id_cuenta: "725901852075382"
    verificado: >
      Cruzado contra el export manual del 2026-09-08 para la ventana
      10/08-06/09: el gasto total coincide salvo ~7 ARS sobre 774.550 (0,001%),
      por reajuste retroactivo normal de Meta. La via es confiable.
    # OJO: hay otras 5 cuentas en el mismo business y ninguna es esta.
    # "Boxer Gestion de AIT (Read-Only)" (987208277687912) tiene nombre parecido,
    # esta habilitada y reporta en USD: consultarla por error da KPIs mal sin
    # que nada falle. Usar SIEMPRE el id, nunca buscar la cuenta por nombre.
    cuentas_a_no_confundir:
      - id: "987208277687912"
        nombre: "Boxer Gestion de AIT (Read-Only)"
        moneda: USD
      - id: "2071098796788922"
        nombre: "Duck Gestión (Read-Only)"
        moneda: USD
    lectura:
      nivel: completo
      nota: >
        Campanas, conjuntos y anuncios con metricas, mas desgloses
        (publisher_platform, platform_position, age, gender, region, device) y
        learning_stage_info a nivel conjunto. Ver referencias/meta-mcp.md.
    herramientas_de_diagnostico:
      # Corregido el 2026-09-11: los tres diagnosticos de relevancia SI estan en
      # el MCP, pero NO como campos de ads_get_ad_entities (ahi dan
      # unknown_fields). Salen de ads_insights_auction_ranking_benchmarks.
      - ads_insights_auction_ranking_benchmarks   # relevancia + solapamiento de subasta
      - ads_get_opportunity_score                 # 71/100 al 2026-09-11; trae delivery_error
      - ads_insights_industry_benchmark           # probada: sin datos para esta cuenta
    no_disponible_por_mcp:
      - "CSV de leads del formulario nativo (nombres y telefonos). Descarga manual, no se versiona crudo."
    exports_manuales: no_hacen_falta
    escritura:
      nivel: ninguno               # ninguno | reversible | creacion | presupuesto
      decidido_por: "vigente por defecto al habilitarse el MCP, 2026-09-11"
      nota: >
        El MCP TRAE las herramientas de escritura y la cuenta las acepta. Que el
        agente no las use es una DECISION, no una limitacion tecnica: sigue
        siendo "el agente propone, Joana ejecuta".
        Mientras esto diga `ninguno`, el agente no llama a ninguna herramienta
        del MCP que modifique, cree, active, pause o borre.
        Para cambiarlo hace falta una decision explicita de Joana escrita aca,
        con fecha y limites. Un "dale, hacelo" en un chat autoriza ESA accion,
        no cambia la politica. Los niveles y sus condiciones estan en el SKILL,
        seccion "Actuar sobre la cuenta".
  api:
    disponible: parcial
    nota: >
      Hay una app propia en Meta for Developers que recibe los leads del
      formulario y los manda a n8n (Joana, 2026-09-07). Esa app es el punto
      donde se resuelve la atribucion: el webhook de leadgen ya trae
      campaign_name / adset_name / ad_name. Los reportes de gasto ya NO
      dependen de ella: entran por el MCP desde el 2026-09-11.

  integracion_leads:
    ruta: "Formulario de Meta -> app propia en Meta for Developers -> n8n -> Bitrix24"
    confirmado_por: "Joana, 2026-09-07"
    estado_atribucion: "n8n NO mapea campaign/adset/ad a los campos UTM de Bitrix"
    nota: >
      Es la ruta correcta para arreglarlo y es un cambio de mapeo dentro de n8n,
      no un desarrollo. Ver referencias/atribucion.md, A1. Ademas hay que
      auditar por que solo el 65% de los leads que Meta factura aparece en el
      CRM (409 sin ubicar).

