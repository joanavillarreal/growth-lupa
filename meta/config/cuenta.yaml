# Inventario de lo que el agente mira. Actualizar cuando cambie algo.
# Los campos en PENDIENTE los completa Joana (ver informes/setup-pendiente.md).

producto_activo: boxer_gestion

productos:
  boxer_gestion:
    nombre: "Boxer Gestion"
    activo: true
    que_es: "Software de gestion para casas de repuestos de autos y motos."
    icp: >
      Casas de repuestos de autos y motos, distribuidoras, desarmaderos,
      autopartes y combinaciones. Talleres mecanicos y lubricentros son rubro
      ADYACENTE: derivan 5,5% contra 43,0% del ICP (mar-sep 2026). Se tratan
      como segmento aparte, nunca como ICP central.
  # Regla de mensaje del canal, actualizada por Joana el 2026-09-09.
  # Antes era absoluta ("no se habla de precio en el anuncio"). Ahora:
  #   - EN FRIO: no se habla de precio ni de bonificaciones. El creativo vende
  #     la conversacion, no el producto.
  #   - EN REMARKETING: si se puede incentivar (hardware bonificado, etc.),
  #     porque el publico ya conoce el producto. Ver EXP-011.
  # Condicion obligatoria: si el incentivo no aplica a todos los planes, eso va
  # escrito EN el anuncio, no solo en la cotizacion del vendedor.
  reglas_de_mensaje:
    precio_en_frio: "no"
    incentivo_en_remarketing: "si, con la condicion visible en el anuncio"
    decidido_por: "Joana, 2026-09-09"

  boxer_taller:
    nombre: "Boxer Taller"
    activo: true                # confirmado por Joana, 2026-09-08
    icp: "Talleres mecanicos y lubricentros."
    nota: >
      Cambia la lectura del canal de Gestion: los 220 leads adyacentes
      (talleres y lubricentros) que derivaban al 5,5% dejan de ser desperdicio
      y pasan a ser el publico de este producto. NO excluirlos: derivarlos.
      Pendiente de Joana: campana de awareness para sumar seguidores.

