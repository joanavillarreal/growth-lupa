entrega:
  artefacto:
    titulo: "Boxer Meta Ads"
    file_path: "informes/artefacto-semanal.html"
    url: "https://claude.ai/code/artifact/b306e530-03e3-42a5-86f3-3e47409ff9b9"
    publicado: "2026-10-05 (2026-W40)"
    formato: cerrado_2026-09-14
    nota: >
      Publicar SIEMPRE desde el mismo file_path para que conserve la URL entre
      corridas. Cambiar de archivo crea un artefacto nuevo con otro link.
      El FORMATO lo cerro Joana el 2026-09-14 y no se rediseña cada semana: se
      parte del archivo publicado y se le cambian los datos. La regla que
      gobierna todo es que cada numero va contra la semana anterior, con fechas
      a la vista. Especificacion y checklist:
      .claude/skills/boxer-meta-ads/referencias/artefacto.md
  panel_trimestral:
    titulo: "Meta Ads por trimestre"
    file_path: "informes/panel-trimestral.html"
    url: "https://claude.ai/artifact/GVEEa9pDVDPmV6Yzn7gS12"
    publicado: "2026-10-05 (Q4 recien arrancado; ultima republicacion diaria con datos hasta el 04/10)"
    actualizacion: diaria, despues de la guardia (Joana, 2026-09-27)
    q_calendario: true              # Q3 = julio a septiembre (Joana, 2026-09-21)
    datos: "informes/panel/datos.json, lo arma scripts/panel_meta.py"
    nota: >
      Es el SEGUNDO artefacto del canal y no reemplaza al semanal: el semanal
      contesta "como fue la semana", este contesta "como se viene moviendo el
      trimestre y que le hicimos". Se republica desde el mismo file_path para
      conservar la URL, igual que el otro.
      Los datos de plataforma y CRM salen de los CSV versionados y arrancan el
      01/07. Las marcas de CAMBIOS arrancan el 22/09 (decision de Joana: no se
      migro la historia en prosa de bitacora-cambios.md).

  slack:
    # CAMBIADO el 2026-09-15 por Joana: antes iba a su DM. Ahora los dos
    # entregables (el artefacto del lunes y las alertas de la guardia) van al
    # canal del equipo.
    canal_id: "C0C2XKTLT9N"
    canal_nombre: "#adqui-notificaciones-canales"
    descripcion: "Canal del equipo. Lo leen Joana y Yamil, no es un DM."
    verificado: "2026-09-15"     # leido por MCP: el ID resuelve y estan los dos
    consecuencia_del_cambio: >
      Lo que se manda ahora lo lee mas de una persona. No cambia QUE se dice
      —los numeros y las salvedades son los mismos— pero si el cuidado: nada de
      taquigrafia interna que solo se entienda desde la corrida, y cada numero
      con su unidad y su periodo. Si alguna vez hace falta decirle algo solo a
      Joana, va a su DM (U0BS7B1ALHK), no aca.
    dm_de_joana: "U0BS7B1ALHK"   # queda anotado; ya NO es el destino por defecto
    nota: >
      Si la sesion no tiene herramientas de Slack, NO simular el envio. Dejar el
      mensaje escrito al principio del informe bajo "AVISO PARA SLACK (no se
      pudo enviar)". El conector de Slack SI se puede adjuntar a una rutina:
      verificado el 2026-09-07 en el agente de Google Ads.
    que_se_manda:
      lunes: >
        LOS DOS LINKS —el artefacto de la semana arriba y el panel trimestral
        ultimo y separado— mas un mensaje corto con las dos caras: lo bueno y lo
        que hay que mirar, con el numero crudo al lado de cada una, y cuantas
        acciones se proponen. Maximo 9 lineas. El molde exacto esta en el SKILL,
        paso 7. Pedido de Joana, 2026-09-15; el link del panel se sumo el
        2026-09-22.
        El cuerpo del mensaje habla SOLO de la semana: el panel es otra ventana
        y se nombra con su Q al lado para que no se mezclen. Si el panel no se
        pudo republicar, el link NO va — mandar el de la semana pasada es peor
        que no mandarlo.
      guardia: >
        SOLO si algo disparo. El bloque que imprime guardia_diaria.py se manda
        tal cual, sin reescribirlo. Si no hay nada, no se manda nada: el
        silencio es el estado normal y es lo que hace que el aviso se lea.

  rutinas:
    # Cambiaron el 2026-09-15: antes era una sola, lunes y jueves.
    convencion_de_nombre: >
      Toda rutina de este agente empieza con "Agente Meta - " (Joana,
      2026-09-15). Formato: "Agente Meta - <que hace> (<cuando> ART)".
      En la lista de Routines de claude.ai conviven las rutinas de todos los
      agentes y todas son de Boxer: el prefijo dice de QUE agente es, que es lo
      unico que ahi no se ve. Si se crea una rutina nueva, se nombra asi.
    analisis_semanal:
      nombre: "Agente Meta - Análisis semanal (lunes 9:00 ART)"
      trigger_id: "trig_015V5mC6g6gxT372Q2MFhu7g"
      cron_utc: "0 12 * * 1"        # lunes 09:00 ART (Argentina es UTC-3 todo el ano)
      hora_real: "12:06 UTC"        # el servidor ancla el minuto al de creacion
      modo: sesion_nueva_por_disparo
      rama_de_salida: main
      notificacion_push: true
      nota: >
        Era "0 12 * * 1,4". El jueves se saco: lo reemplaza la guardia diaria.
    guardia_diaria:
      nombre: "Agente Meta - Guardia diaria (todos los días 8:00 ART)"
      trigger_id: "trig_0122tJ3eH91B5NWnhgzyoQ3s"   # creada 2026-09-15
      cron_utc: "0 11 * * *"        # todos los dias 08:00 ART
      modo: sesion_nueva_por_disparo
      rama_de_salida: main
      notificacion_push: true
      nota: >
        Corre ANTES que Joana empiece el dia, a proposito: la idea es que no
        tenga que entrar a la plataforma a buscar si algo se rompio. Los lunes
        corre igual, una hora antes del analisis: son cosas distintas y la
        guardia puede encontrar algo que el informe del lunes no mira.
    repo_y_conectores: >
      Las TRES rutinas tienen el repo y los conectores MCP-Meta y Slack.
      Verificado el 2026-09-15 leyendo las rutinas por API, despues de que
      Joana los adjuntara a mano en claude.ai (la API no deja pasarlos al
      crearlas).
    novedades_semanales:
      nombre: "Agente Meta - Novedades de la plataforma (domingos 10:00 ART)"
      trigger_id: "trig_01TuTLmB25GvVP6FJFWPbZ2h"   # creada 2026-09-15
      cron_utc: "0 13 * * 0"        # domingos 10:00 ART
      modo: sesion_nueva_por_disparo
      rama_de_salida: main
      notificacion_push: true
      nota: >
        Corre el domingo para que lo que Joana apruebe llegue a tiempo a la
        corrida del lunes, que es la que lee el hilo de Slack y lo escribe en
        aprendizajes.md.
    rama_de_salida_de_las_rutinas: >
      El campo "rama de salida" de las rutinas dice claude/<algo>, no `main`, y
      Joana verifico el 2026-09-15 que la UI no la deja cambiarlo.
      NO ES UN PROBLEMA: el prompt de cada rutina hace `git push origin main`
      explicito y eso funciona — la corrida del 2026-09-14 dejo sus commits en
      `main` con la rama de salida ya apuntando a otro lado. Ese campo es de
      donde la sesion propone cambios, no de donde el agente commitea.
      La regla sigue siendo la del CLAUDE.md: todo va a `main`, y si una corrida
      termina commiteando en otra rama, eso se reporta.
