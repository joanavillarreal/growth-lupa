<title>Monitor de Growth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: panel de administración. Barra lateral fija a la izquierda con las
   solapas y los trimestres; arriba del contenido, el rango del Q; tarjetas
   blancas redondeadas sobre gris azulado. En el teléfono la barra lateral se
   vuelve una barra de solapas pegada arriba y todo va en una columna. */
:root{
  --bg:#f4f6fb; --card:#ffffff; --soft:#f7f9fc; --line:#e9edf4; --line-2:#dce2ec;
  --ink:#0f1729; --ink-2:#5f6b7f; --ink-3:#98a2b3;
  --blue:#2463eb; --blue-2:#5b8cff; --blue-soft:#eaf0ff; --blue-ink:#ffffff;
  --good:#16a34a; --good-bg:#e7f7ed; --bad:#dc2626; --bad-bg:#fdecec; --warn:#c2680a; --warn-bg:#fdf1e2;
  --flat:#64748b; --flat-bg:#eef1f6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s7:#4a3aa7; --s0:#a3adb6;
  --gold:#e0a100; --silver:#9aa6b8; --bronze:#c77443;
  --shade:rgba(15,23,41,.45); --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.04);
  --r:16px;
  --f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e131c; --card:#161d29; --soft:#1b2331; --line:#232c3b; --line-2:#2e3950;
  --ink:#eef2f8; --ink-2:#a1adc0; --ink-3:#6c788d;
  --blue:#5b8cff; --blue-2:#7fa5ff; --blue-soft:#1b2744; --blue-ink:#0e131c;
  --good:#4ade80; --good-bg:#15291e; --bad:#f87171; --bad-bg:#301819; --warn:#fbbf24; --warn-bg:#2e2411;
  --flat:#a1adc0; --flat-bg:#222b3a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s7:#9085e9; --s0:#5d6873;
  --gold:#e8b53a; --silver:#8793a6; --bronze:#c9814f;
  --shade:rgba(0,0,0,.6); --shadow:none;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e131c; --card:#161d29; --soft:#1b2331; --line:#232c3b; --line-2:#2e3950;
  --ink:#eef2f8; --ink-2:#a1adc0; --ink-3:#6c788d;
  --blue:#5b8cff; --blue-2:#7fa5ff; --blue-soft:#1b2744; --blue-ink:#0e131c;
  --good:#4ade80; --good-bg:#15291e; --bad:#f87171; --bad-bg:#301819; --warn:#fbbf24; --warn-bg:#2e2411;
  --flat:#a1adc0; --flat-bg:#222b3a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s7:#9085e9; --s0:#5d6873;
  --gold:#e8b53a; --silver:#8793a6; --bronze:#c9814f;
  --shade:rgba(0,0,0,.6); --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
button{font-family:inherit}
svg{display:block}

/* ---------- estructura ---------- */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
@media (min-width:1000px){ .app{grid-template-columns:248px minmax(0,1fr)} }
.side{display:none}
@media (min-width:1000px){
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);
    height:100vh;overflow-y:auto;background:var(--card);border-right:1px solid var(--line);padding:20px 16px}
}
.logo{display:flex;align-items:center;gap:10px;padding:2px 6px 16px}
.logo .mk{width:34px;height:34px;border-radius:10px;background:var(--blue);display:grid;place-items:center;flex:0 0 auto}
.logo b{font-size:16px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.1}
.logo small{font-size:11.5px;color:var(--ink-3);font-weight:500}
.nav-t{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700;padding:12px 10px 4px}
.nav-i{appearance:none;display:flex;align-items:center;gap:11px;width:100%;border:none;background:none;
  color:var(--ink-2);font-size:14px;font-weight:600;padding:9px 10px;border-radius:10px;cursor:pointer;text-align:left}
.nav-i svg{flex:0 0 auto;color:var(--ink-3)}
.nav-i:hover{background:var(--soft);color:var(--ink)}
.nav-i[aria-selected="true"],.nav-i[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue)}
.nav-i[aria-selected="true"] svg,.nav-i[aria-pressed="true"] svg{color:var(--blue)}
.nav-i .bdg{margin-left:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--bad-bg);color:var(--bad)}
.nav-i .bdg.gris{background:var(--flat-bg);color:var(--flat)}
.promo{margin-top:auto;background:var(--blue);color:var(--blue-ink);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.promo b{font-size:14.5px}
.promo span{font-size:12.5px;opacity:.9;line-height:1.45}
.promo .num{font-size:28px;font-weight:800;line-height:1}

.main{min-width:0;padding-inline:16px;padding-block:14px 56px}
@media (min-width:1000px){ .main{padding-inline:28px;padding-block:22px 64px} }
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
#panel{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:699px){ #panel{gap:12px} }

/* ---------- encabezado ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.top .mlogo{display:flex;align-items:center;gap:9px}
@media (min-width:1000px){ .top .mlogo{display:none} }
.top h1{font-size:22px;flex:1 1 auto;min-width:0}
.top h1 small{display:block;font-size:12.5px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip svg{color:var(--ink-3)}
.chip.azul{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.chip.azul svg{color:var(--blue-ink)}
.acciones{display:flex;flex-wrap:wrap;gap:8px}

/* barra del teléfono */
.mbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:8px 16px 10px;
  display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
@media (min-width:1000px){ .mbar{display:none} }
.mtabs,.mqs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.mtabs::-webkit-scrollbar,.mqs::-webkit-scrollbar{display:none}
.mtab{appearance:none;flex:0 0 auto;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);
  color:var(--ink-2);font-size:13px;font-weight:600;padding:7px 12px;border-radius:10px;cursor:pointer}
.mtab svg{color:var(--ink-3)}
.mtab[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.mtab[aria-selected="true"] svg{color:var(--blue-ink)}
.mq{appearance:none;flex:0 0 auto;border:none;background:none;font-size:12.5px;font-weight:700;color:var(--ink-3);padding:3px 8px;border-radius:7px;cursor:pointer}
.mq[aria-pressed="true"]{color:var(--ink);background:var(--card)}
.nav-i:focus-visible,.mtab:focus-visible,.mq:focus-visible,.i:focus-visible,.cerrar:focus-visible,.mas:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- tarjetas ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--shadow)}
.ch{display:flex;align-items:center;gap:7px;margin-bottom:12px;min-width:0}
.ch h2{font-size:15.5px}
.ch .hint{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:500;text-align:right}
.g{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.g.k4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){ .g.k4{gap:16px} .g.c2{grid-template-columns:repeat(2,minmax(0,1fr))} .g.c3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (min-width:1100px){ .g.k4{grid-template-columns:repeat(4,minmax(0,1fr))} .g.main2{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)} .g.c3{grid-template-columns:repeat(3,minmax(0,1fr))} }
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.sub{font-size:12.5px;color:var(--ink-2)}
.muted{color:var(--ink-3)}

/* KPI */
.kpi .kh{display:flex;align-items:center;gap:6px}
.kpi .kt{font-size:13px;font-weight:600;color:var(--ink-2)}
.kpi .ico{margin-left:auto;width:34px;height:34px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:0 0 auto}
.kpi .kv{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-top:8px}
.kpi .kv b{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .kc{font-size:12px;color:var(--ink-3);margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.desmejora{background:var(--bad-bg);color:var(--bad)}
.pill.mejora{background:var(--good-bg);color:var(--good)}
.pill.estable,.pill.sin_lectura{background:var(--flat-bg);color:var(--flat)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}

/* info */
.i{appearance:none;flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);background:transparent;
  color:var(--ink-3);font:700 11px/1 var(--f);cursor:pointer;display:inline-grid;place-items:center;padding:0;position:relative}
.i::after{content:"";position:absolute;inset:-11px}
.i:hover{color:var(--blue);border-color:var(--blue)}

/* funnel */
.fun{display:flex;flex-direction:column;gap:12px}
.fr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.fr .l{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;min-width:0}
.fr .v{font-size:17px;font-weight:800;text-align:right}
.fr .bar{grid-column:1 / -1;height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.fr .bar i{display:block;height:100%;border-radius:6px;background:var(--blue)}
.fr.lateral .bar i{background:var(--ink-3)}
.fr .d{grid-column:1 / -1;font-size:12px;color:var(--ink-2)}
.fr .d b{color:var(--ink)}
.plata{margin-top:4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--blue-soft);border-radius:12px;padding:12px 14px}
.plata .l{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--blue)}
.plata .v{margin-left:auto;font-size:22px;font-weight:800;color:var(--blue)}
.plata .d{flex-basis:100%;font-size:12px;color:var(--ink-2)}

/* mini estadísticas debajo del gráfico */
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.mini .n{font-size:17px;font-weight:800}
.mini .t{font-size:11.5px;color:var(--ink-3);font-weight:600;overflow-wrap:anywhere}
.mini .u{height:4px;border-radius:2px;margin-top:6px}

/* gráfico de línea */
.chart{position:relative}
.chart svg{width:100%;height:auto;overflow:visible;touch-action:pan-y}
.tot{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:6px}
.tot .big{font-size:28px;font-weight:800;letter-spacing:-.02em}
.tot .vs{font-size:12.5px;color:var(--ink-2)}
.leyenda{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.leyenda .ln{width:16px;height:0;border-radius:0;border-top:2.5px solid var(--blue);vertical-align:3px}
.leyenda .dash{width:16px;height:0;border-radius:0;border-top:2px dashed var(--ink-3);vertical-align:3px}
.tt{position:absolute;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;padding:6px 10px;border-radius:8px;
  white-space:nowrap;transform:translate(-50%,-100%);line-height:1.45;z-index:5}

/* barras verticales */
.vb{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:26px}
.vb .c{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.vb .b{width:100%;max-width:44px;border-radius:8px 8px 4px 4px;background:var(--blue-soft);position:relative;min-height:4px}
.vb .c.top .b{background:var(--blue)}
.vb .b span{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.vb .c.top .b span{background:var(--ink);color:var(--card);padding:1px 7px;border-radius:6px;top:-24px}
.vb .x{font-size:11px;color:var(--ink-3);font-weight:600;text-align:center;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* gauge */
.gauge{display:flex;flex-direction:column;align-items:center;gap:2px}
.gauge svg{width:100%;max-width:260px;height:auto}
.gauge .gv{font-size:30px;font-weight:800;margin-top:-58px;letter-spacing:-.02em}
.gauge .gs{font-size:12.5px;color:var(--ink-2);text-align:center;margin-top:2px}
.lista{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.lista .fila{display:flex;gap:10px;justify-content:space-between}
.lista .fila span:first-child{min-width:0;overflow-wrap:anywhere}
.lista .fila span:last-child{color:var(--ink-2);font-weight:600;white-space:nowrap}
.lista .tit{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700}

/* números sueltos */
.stat .top2{display:flex;align-items:center;gap:6px}
.stat .k{font-size:13px;font-weight:600;color:var(--ink-2)}
.stat .top2 .i{margin-left:auto}
.stat .v{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-top:6px}
.stat .v b{font-size:25px;font-weight:800;letter-spacing:-.02em}
.stat .v small{font-size:13px;color:var(--ink-2);font-weight:600}
.stat .sub{margin-top:3px}

/* barras horizontales */
.hb{display:flex;flex-direction:column;gap:10px}
.hb-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:baseline}
.hb-row .l{font-size:13px;font-weight:500;min-width:0;overflow-wrap:anywhere}
.hb-row .n{font-size:13px;font-weight:700;text-align:right;white-space:nowrap}
.hb-row .n small{font-weight:500;color:var(--ink-3);margin-left:6px}
.hb-row .track{grid-column:1 / -1;height:8px;background:var(--soft);border-radius:5px;overflow:hidden}
.hb-row .fill{height:100%;background:var(--blue);border-radius:5px;min-width:3px}
.hb-row .x{grid-column:1 / -1;font-size:11.5px;color:var(--ink-3);margin-top:-2px}
.mas{appearance:none;border:none;background:none;color:var(--blue);font-size:12.5px;font-weight:700;cursor:pointer;padding:4px 0;align-self:flex-start}

/* tablas */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-inline:-4px;padding-inline:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;color:var(--ink-3);font-weight:600;text-align:right;padding:9px 10px;background:var(--soft);white-space:nowrap}
th:first-child{border-radius:9px 0 0 9px;text-align:left} th:last-child{border-radius:0 9px 9px 0}
td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-weight:600}
td:first-child{text-align:left;white-space:normal;min-width:130px;font-weight:600}
td .rk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--soft);color:var(--ink-2);font-size:11.5px;font-weight:700;margin-right:9px;vertical-align:middle}
td.sec{color:var(--ink-2);font-weight:500}
tfoot td{border-bottom:none;font-weight:800}
tbody tr:hover td{background:var(--soft)}

/* podio */
.podio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.esc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0}
.esc .nom{font-weight:700;font-size:13px;line-height:1.25;overflow-wrap:anywhere}
.esc .pts{font-size:11.5px;color:var(--ink-3);font-weight:600}
.esc .base{width:100%;border-radius:10px 10px 4px 4px;display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff}
.esc.p1 .base{height:96px;background:var(--gold)}
.esc.p2 .base{height:68px;background:var(--silver)}
.esc.p3 .base{height:48px;background:var(--bronze)}
.criterios{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.crit .t{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700;margin-bottom:4px}
.crit ol{margin:0;padding-left:18px;font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.crit ol span{color:var(--ink-3);margin-left:4px;font-weight:600}

/* apiladas */
.stk{display:flex;flex-direction:column;gap:16px;margin-top:12px}
.stk-row .cab{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;margin-bottom:6px}
.stk-bar{display:flex;height:12px;gap:2px;border-radius:6px;overflow:hidden;background:var(--soft)}
.stk-bar span{display:block;height:100%;min-width:3px}
.stk-row .vals{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:6px;font-size:11.5px;color:var(--ink-2)}
.stk-row .vals i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.stk-row .vals b{color:var(--ink)}

/* destacados */
.dest .k{font-size:13px;font-weight:600;color:var(--ink-2)}
.dest .big{font-size:22px;font-weight:800;line-height:1.2;margin-top:6px;overflow-wrap:anywhere}

/* avisos */
.aviso{font-size:13px;color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.aviso b{color:var(--ink)}
.atraso-meta{font-size:14px;color:var(--bad);background:var(--bad-bg);border:1.5px solid var(--bad);border-radius:12px;padding:12px 14px;line-height:1.5}
.atraso-meta b{font-size:15px}
details.salud{background:var(--warn-bg);border-radius:12px;padding:10px 14px;font-size:13px}
details.salud.ok{background:var(--good-bg)}
details.salud summary{cursor:pointer;font-weight:700;color:var(--warn)}
details.salud.ok summary{color:var(--good)}
details.salud ul{margin:8px 0 2px;padding-left:18px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
details.salud li b{color:var(--ink)}

/* hoja de info */
.velo{position:fixed;inset:0;background:var(--shade);z-index:40}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:42;background:var(--card);color:var(--ink);border-radius:18px 18px 0 0;
  padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:78vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
@media (min-width:700px){ .hoja{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100vw - 32px));border-radius:16px;padding-bottom:22px} }
.hoja .cab{display:flex;align-items:flex-start;gap:12px;margin-bottom:8px}
.hoja h3{font-size:17px;flex:1}
.cerrar{appearance:none;border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);border-radius:9px;font-size:12.5px;font-weight:700;padding:5px 11px;cursor:pointer}

/* ------------------------------------------------------------ componentes */
function card(titulo, k, cuerpo, hint = "") {
  return `<section class="card"><div class="ch"><h2>${titulo}</h2>${k ? info(k) : ""}${hint ? `<span class="hint">${hint}</span>` : ""}</div>${cuerpo}</section>`;
}
function pill(m, invertida = false) {
  if (!m) return "";
  if (m.estado === "sin_lectura") return `<span class="pill sin_lectura">sin lectura</span>`;
  const d = m.delta_pp != null ? m.delta_pp : m.delta_pct;
  if (d == null) return "";
  const txt = m.delta_pp != null ? `${d > 0 ? "+" : ""}${new Intl.NumberFormat("es-AR", {maximumFractionDigits: 1}).format(d)} pp` : `${new Intl.NumberFormat("es-AR", {maximumFractionDigits: 1}).format(Math.abs(d))}%`;
  return `<span class="pill ${m.estado}">${d >= 0 ? "▲" : "▼"} ${txt}</span>`;
}
function kpi(q, titulo, valor, icono, clave, fmt, k) {
  const m = clave ? q.comparacion.metricas[clave] : null;
  const prev = q.comparacion.previo;
  let pie = "";
  if (m && prev && m.previo != null) pie = `vs ${fmt(m.previo)} en ${qNombre(prev.etiqueta)} · mismo tramo`;
  else if (m && !prev) pie = "sin Q anterior para comparar";
  return `<div class="card kpi"><div class="kh"><span class="kt">${titulo}</span>${info(k)}<span class="ico">${ico(icono)}</span></div>
    <div class="kv"><b>${valor}</b>${pill(m)}</div>${pie ? `<div class="kc">${pie} ${m ? info("comparacion") : ""}</div>` : ""}</div>`;
}
function stat(k, titulo, valor, sub, extra, m) {
  return `<div class="card stat"><div class="top2"><span class="k">${titulo}</span>${info(k)}</div>
    <div class="v"><b>${valor}</b>${pill(m)}</div>${sub ? `<div class="sub">${sub}</div>` : ""}${extra || ""}</div>`;
}
function lista(titulo, filas) {
  if (!filas.length) return "";
  return `<div class="lista"><div class="tit">${titulo}</div>${filas.map(([a, b]) => `<div class="fila"><span>${esc(a)}</span><span>${b}</span></div>`).join("")}</div>`;
}
function hbars(filas, {fmt = n, total = null, limite = 8, extra = null} = {}) {
  if (!filas.length) return `<p class="sub muted">Sin datos en este trimestre.</p>`;
  const max = Math.max(...filas.map(f => f[1] || 0)) || 1;
  const id = "hb" + Math.random().toString(36).slice(2, 8);
  const html = filas.map((f, i) => `<div class="hb-row"${i >= limite ? ` data-extra="${id}" hidden` : ""}>
      <span class="l">${esc(f[0])}</span><span class="n">${fmt(f[1])}${total ? `<small>${pct(r1(f[1] / total * 100))}</small>` : ""}</span>
      <div class="track"><div class="fill" style="width:${(f[1] || 0) / max * 100}%"></div></div>${extra ? `<span class="x">${extra(f)}</span>` : ""}</div>`).join("");
  return `<div class="hb">${html}${filas.length > limite ? `<button class="mas" type="button" data-mas="${id}">Ver ${filas.length - limite} más</button>` : ""}</div>`;
}
function vbars(filas, fmt = n) {
  if (!filas.length) return `<p class="sub muted">Sin datos en este trimestre.</p>`;
  const f = filas.slice(0, 6), max = Math.max(...f.map(x => x[1]), 1);
  return `<div class="vb">${f.map((x, i) => `<div class="c${i === 0 ? " top" : ""}"><div class="b" style="height:${Math.max(x[1] / max * 100, 3)}%"><span>${fmt(x[1])}</span></div><span class="x" title="${esc(x[0])}">${esc(x[0].startsWith("Usuario #") ? x[0].slice(8) : x[0].split(" ")[0])}</span></div>`).join("")}</div>`;
}
function gauge(valor, sub) {
  const v = Math.max(0, Math.min(100, valor || 0));
  const N = 30, cx = 130, cy = 128, R1 = 92, R2 = 118;
  let t = "";
  for (let i = 0; i < N; i++) {
    const a = Math.PI * (1 - i / (N - 1));
    const on = i / (N - 1) <= v / 100 + 1e-9 && v > 0;
    t += `<line x1="${(cx + R1 * Math.cos(a)).toFixed(1)}" y1="${(cy - R1 * Math.sin(a)).toFixed(1)}" x2="${(cx + R2 * Math.cos(a)).toFixed(1)}" y2="${(cy - R2 * Math.sin(a)).toFixed(1)}" stroke="${on ? "var(--blue)" : "var(--line-2)"}" stroke-width="6" stroke-linecap="round"/>`;
  }
  return `<div class="gauge"><svg viewBox="0 0 260 140" role="img" aria-label="${pct(valor)}">${t}</svg><div class="gv">${pct(valor)}</div><div class="gs">${sub}</div></div>`;
}
function linea(s, etiqueta) {
  const act = s.actual.valores, prev = s.previo ? s.previo.valores : [];
  const N = Math.max(act.length, prev.length, 1), max = Math.max(...act, ...prev, 1);
  const paso = max > 200 ? 100 : max > 80 ? 25 : max > 40 ? 10 : 5, top = Math.ceil(max / paso) * paso;
  const W = 560, H = 220, L = 34, R = 12, T = 14, B = 26;
  const x = i => L + (N === 1 ? 0 : i * (W - L - R) / (N - 1)), y = v => T + (H - T - B) * (1 - v / top);
  const path = arr => arr.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  let grid = "";
  for (let v = 0; v <= top; v += paso) grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="${v ? "3 4" : ""}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${v}</text>`;
  let ticks = "";
  const rg = (s.actual.rangos || []).concat((s.previo?.rangos || []).slice((s.actual.rangos || []).length));
  const dm = iso => iso ? `${iso.slice(8)}/${iso.slice(5, 7)}` : "";
  const etq = i => s.actual.rangos && s.actual.rangos[i] ? dm(s.actual.rangos[i][0]) : `S${i + 1}`;

    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Serie semanal de ${qNombre(etiqueta)}">

/* ------------------------------------------------------------ objetivos */
const INFO_OBJ = {cac: "obj_cac", roas: "obj_roas", no_calificados: "obj_no_calif", leads: "obj_leads", casas_repuestos: "obj_casas", win_rate: "obj_win"};

function tarjetaObj(o) {

const COLOR_MIX = {pago: "var(--s1)", vivo: "var(--s3)", otro: "var(--s4)", sin: "var(--s0)"};
function estadoTxt(ok, acum) { return ok == null ? "Sin datos" : ok ? (acum ? "En ritmo" : "En objetivo") : (acum ? "Debajo del ritmo" : "Fuera de objetivo"); }

  document.getElementById("promo").innerHTML = `${ico("campana", 22)}<b>Alarma diaria</b><span class="num">${nr}</span><span>${nr === 1 ? "número en desmejora" : "números en desmejora"} en ${qNombre(act.etiqueta)} contra el mismo tramo de ${qNombre(act.comparacion.previo?.etiqueta) || "el Q anterior"}. Avisa por Slack el día en que un número pasa a rojo.</span>`;
  const am = D.gasto_meta_atrasado;
  const atraso = am ? `<div class="atraso-meta" role="alert"><b>Gasto de Meta sin actualizar desde ${am.hasta ? "el " + fecha(am.hasta) : "siempre"}.</b> Los días siguientes cuentan como inversión cero: el CPL, el CAC y el ROAS de Meta Ads, de Redes Sociales y los generales salen más baratos de lo real. No los leas como si estuvieran al día.</div>` : "";
  document.getElementById("panel").innerHTML = atraso + PINTAR[tabSel](q);
  document.getElementById("panel").setAttribute("aria-label", nombreTab);
}
function elegirTab(t) { tabSel = t; guardar("tab", t); try { history.replaceState(null, "", "#" + t); } catch (e) {} pintar(); }

document.querySelectorAll("[data-ico]").forEach(e => e.innerHTML = ico(e.dataset.ico, 20));
document.getElementById("pie").textContent = `Snapshot diario de Bitrix24 y Meta del ${fecha(D.generado_en)}. Cada ⓘ explica cómo se calcula el número y de dónde sale.`;

document.addEventListener("click", ev => {
  const q = ev.target.closest("[data-q]"); if (q) { qSel = +q.dataset.q; guardar("q", D.trimestres[qSel].etiqueta); pintar(); return; }
  const t = ev.target.closest("[data-tab]"); if (t) { elegirTab(t.dataset.tab); return; }
  const i = ev.target.closest("[data-info]"); if (i) { abrirInfo(i.dataset.info, i); return; }
  const x = ev.target.closest("[data-exp]"); if (x) { abrirExp(+x.dataset.exp, x); return; }
  if (ev.target.closest("#mcerrar")) { cerrarExp(); return; }
  const m = ev.target.closest("[data-mas]");
  if (m) { document.querySelectorAll(`[data-extra="${m.dataset.mas}"]`).forEach(e => e.hidden = false); m.remove(); }
});
document.addEventListener("keydown", ev => {
  const t = ev.target.closest && ev.target.closest("[data-tab]");
  if (!t || !["ArrowRight", "ArrowLeft", "ArrowDown", "ArrowUp"].includes(ev.key)) return;
  const ks = TABS.map(x => x[0]), i = ks.indexOf(tabSel) + (["ArrowRight", "ArrowDown"].includes(ev.key) ? 1 : -1);
  const nuevo = ks[(i + ks.length) % ks.length], dentro = t.parentElement.id;
  elegirTab(nuevo); document.querySelector(`#${dentro} [data-tab="${nuevo}"]`)?.focus(); ev.preventDefault();
});

let origenInfo = null;
function abrirInfo(k, boton) {
  const [t, d, fuente] = INFO[k] || [k, "", ""];
  document.getElementById("hoja-t").textContent = t;
  document.getElementById("hoja-c").innerHTML = `<p>${esc(d)}</p><div class="fuente"><b>De dónde sale:</b> ${esc(fuente)}</div>`;
  document.getElementById("velo").hidden = false; document.getElementById("hoja").hidden = false;
  origenInfo = boton; document.getElementById("cerrar").focus();
}
function cerrarInfo() { if (document.getElementById("modal").hidden) document.getElementById("velo").hidden = true; document.getElementById("hoja").hidden = true; if (origenInfo) origenInfo.focus(); }
document.getElementById("cerrar").addEventListener("click", cerrarInfo);
document.getElementById("velo").addEventListener("click", () => { if (!document.getElementById("hoja").hidden) cerrarInfo(); else cerrarExp(); });
document.addEventListener("keydown", ev => {
  if (ev.key !== "Escape") return;
  if (!document.getElementById("hoja").hidden) cerrarInfo(); else if (!document.getElementById("modal").hidden) cerrarExp();
});

document.addEventListener("pointermove", mover); document.addEventListener("pointerdown", mover);
function mover(ev) {
  document.querySelectorAll(".chart .tt").forEach(tt => { if (!tt.parentElement.contains(ev.target)) { tt.hidden = true; tt.parentElement.querySelector(".cross").setAttribute("opacity", "0"); } });
  const hit = ev.target.closest && ev.target.closest(".hit"); if (!hit) return;
  const c = hit.closest(".chart"), svg = c.querySelector("svg"), s = JSON.parse(decodeURIComponent(c.dataset.serie));
  const r = svg.getBoundingClientRect(), k = r.width / s.W, px = (ev.clientX - r.left) / k;
  const i = Math.max(0, Math.min(s.N - 1, Math.round((px - s.L) / ((s.W - s.L - s.R) / Math.max(s.N - 1, 1)))));
  const cx = s.L + (s.N === 1 ? 0 : i * (s.W - s.L - s.R) / (s.N - 1));
  const cross = c.querySelector(".cross"); cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("opacity", ".6");
  const tt = c.querySelector(".tt");
  const f2 = r => r ? `${r[0].slice(8)}/${r[0].slice(5, 7)}–${r[1].slice(8)}/${r[1].slice(5, 7)}` : "";
  tt.innerHTML = `Semana ${i + 1}<br>${s.qa}${s.ra[i] ? ` (${f2(s.ra[i])})` : ""}: <b>${s.act[i] ?? "—"}</b>${s.qp ? `<br>${s.qp}${s.rp[i] ? ` (${f2(s.rp[i])})` : ""}: <b>${s.prev[i] ?? "—"}</b>` : ""}`;
  const cr = c.getBoundingClientRect();
  tt.style.left = Math.max(60, Math.min(cr.width - 60, r.left - cr.left + cx * k)) + "px";
  tt.style.top = (r.top - cr.top + 10) + "px"; tt.hidden = false;
}

const hash = location.hash.slice(1), ks = TABS.map(x => x[0]);
tabSel = ks.includes(hash) ? hash : (ks.includes(leer("tab")) ? leer("tab") : "funnel");
const qG = D.trimestres.findIndex(q => q.etiqueta === leer("q")); if (qG >= 0) qSel = qG;
pintar();
</script>
