<title>Panel de redes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: una columna de lectura de arriba hacia abajo. Cuentas (Gestión | Taller lado a lado),
   leads de redes del trimestre, y la semana elegida. Números en condensada, texto en sans. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --soft:#eef1f5; --line:#dfe3ea;
  --ink:#141a23; --ink-2:#4f5967; --ink-3:#7c8594;

  --good:#1a7f4b; --good-bg:#e4f4ea; --bad:#b93a2c; --bad-bg:#fbe9e6; --warn:#9a5a00; --warn-bg:#fdf0dc;
  --f-num:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-txt:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1319; --surface:#171c24; --soft:#1e242e; --line:#2a313d;
  --ink:#edf1f6; --ink-2:#aab3c0; --ink-3:#7d8796;
  --org:#3987e5; --org-soft:#1a2a40; --pago:#5d6673;
  --good:#4cc38a; --good-bg:#15281f; --bad:#f07466; --bad-bg:#33191a; --warn:#f0a43a; --warn-bg:#30240f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1319; --surface:#171c24; --soft:#1e242e; --line:#2a313d;
  --ink:#edf1f6; --ink-2:#aab3c0; --ink-3:#7d8796;
  --org:#3987e5; --org-soft:#1a2a40; --pago:#5d6673;
  --good:#4cc38a; --good-bg:#15281f; --bad:#f07466; --bad-bg:#33191a; --warn:#f0a43a; --warn-bg:#30240f;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-txt);-webkit-font-smoothing:antialiased}
.page{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:28px}
@media (min-width:760px){ .page{padding-inline:28px} }
h1,h2,h3{margin:0;font-family:var(--f-num);font-weight:700;letter-spacing:.005em;text-wrap:balance}
h1{font-size:30px;line-height:1.1}
h2{font-size:22px}
h3{font-size:17px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)} .sub{color:var(--ink-2);font-size:13.5px}
a{color:var(--org)}
a:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--org);outline-offset:2px}

/* encabezado */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;justify-content:space-between}
.top .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.selector{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}

/* secciones */
section{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.sec-h .sub{margin-left:auto}
.grid2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:900px){ .grid2{grid-template-columns:repeat(2,minmax(0,1fr))} }
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.brand-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink-2)}

/* KPIs */
.kpis{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:520px){ .kpis{grid-template-columns:minmax(0,1fr)} }
.kpi{background:var(--soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{font-size:12.5px;color:var(--ink-2);font-weight:500}
.kpi .v{font-size:28px;font-weight:700;line-height:1.1}
.kpi .d{font-size:12.5px;color:var(--ink-3)}
.up{color:var(--good)} .down{color:var(--bad)}
.flag{display:inline-block;margin-top:4px;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}

/* gráficos */
.charts{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}

.ch{display:flex;flex-direction:column;gap:4px;min-width:0}
.ch .ct{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.ch svg{width:100%;height:auto;max-height:240px;display:block;overflow:visible}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.otras{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:10px}
.otras b{color:var(--ink);font-weight:600}
svg .ax{fill:var(--ink-3);font:11px var(--f-txt)}
svg .val{fill:var(--ink-2);font:600 11px var(--f-num)}
svg .grid{stroke:var(--line);stroke-width:1}

/* leads */
.leads{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){ .leads{grid-template-columns:minmax(0,1fr) minmax(0,2fr)} }
.big{font-size:56px;font-weight:700;line-height:1}
.estados{display:flex;flex-wrap:wrap;gap:6px}
.nota{font-size:12.5px;color:var(--ink-3);max-width:70ch}

/* semana */
.titular{font-size:17px;line-height:1.5;max-width:75ch;margin:0}
.listas{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){ .listas{grid-template-columns:repeat(2,minmax(0,1fr))} }
.lista h3{display:flex;align-items:center;gap:8px}
.lista ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.alertas{background:var(--warn-bg);border-radius:10px;padding:12px 14px}
.alertas h3{color:var(--warn)}
.alertas ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{white-space:normal;min-width:180px;max-width:420px}
td .pz{display:flex;flex-direction:column;gap:2px}
td .pz small{color:var(--ink-3)}
.crm{display:flex;flex-wrap:wrap;gap:8px 28px}
.crm div{display:flex;flex-direction:column}
.crm .v{font-size:24px;font-weight:700}
.crm .k{font-size:12.5px;color:var(--ink-2)}
.pie{font-size:12px;color:var(--ink-3)}

#tip{position:fixed;pointer-events:none;z-index:10;background:var(--ink);color:var(--surface);font-size:12.5px;line-height:1.4;padding:6px 9px;border-radius:7px;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){ .bar{transition:opacity .15s} }
.bar.dim{opacity:.35}
.atraso{font-size:14px;color:var(--bad);background:var(--bad-bg);border:1.5px solid var(--bad);border-radius:10px;padding:10px 14px}
</style>

 sobre 149 de alcance**; la cuenta pasó de 1 guardado en la W36 a 3 en la W37. El formato accionable mueve algo, pero para el pilar donde el guardado es la métrica reina uno sigue siendo poco. Falta la versión checklist pura para cerrarla."}, {"pregunta": "¿El colaborativo con un negocio real es la palanca de captación que le falta a Gestión?", "estado_y_evidencia": "Abierta por la W38. La única pieza de todo el sistema que circuló esa semana fue el colaborativo de Rojas —15 compartidos y 3 altas directas en la cuenta de Taller—, mientras Gestión cerraba en cero compartidos, cero guardados y cero altas netas con cinco piezas publicadas. Es el mismo mecanismo de personas que ya está confirmado, pero con la distribución de un tercero encima en vez del algoritmo. Para confirmarla hace falta un colaborativo publicado **del lado de Gestión**, con una casa de la red. El de Rojas no sirve como prueba: el negocio es taller y casa de repuestos a la vez, y el arrastre se repartió entre las tres cuentas. Si un colaborativo de Gestión sola trae altas y compartidos, la grilla deja de girar alrededor del calendario de pilares y pasa a girar alrededor de a quién se puede coordinar cada mes."}, {"pregunta": "¿Los hashtags suman alcance?", "estado_y_evidencia": "Abierta el 23/9/2026 (consulta C1). Con lo que se puede medir, no se ve efecto en ninguna dirección: en las 18 piezas de la W35 a la W38 (9 con hashtags en el texto, 9 sin), los posts tienen la misma mediana de alcance orgánico con y sin hashtags (174,5 contra 169) y la correlación entre cantidad de hashtags y alcance es nula (rho −0,13). Ninguna de las dos mitades trajo seguidores. La diferencia en reels (138 contra 517) la explica la gente en la pieza, no el hashtag: los reels sin hashtags son CERAC y soporte, los con hashtags son los clips del webinar. **El dato que decidiría no existe**: Metricool no da alcance por origen (hashtags / explorar) ni alcance en no seguidores por pieza. Se cierra con una prueba A/B dentro de la misma semana y el mismo pilar, o mirando \"De hashtags\" en las estadísticas nativas de Instagram de cada pieza. Detalle en `data/hashtags/analisis.json`."}]}, "boxer-taller": {"descartado": [{"mecanismo": "Humor del rubro en placa, sin pilar", "evidencia": "26/8/2026: 0 interacciones sobre 26 de alcance. Pedía un comentario sin haber dado antes una razón para comentar. El humor puede ir, pero colgado de un pilar — y no en placa (ver la hipótesis del reel, abajo)"}], "en_prueba": [{"pregunta": "¿La red de repuesteras mueve la aguja?", "estado_y_evidencia": "**Confirmado en la W38.** El colaborativo de Rojas, primera ejecución del pilar 4 después de cuatro semanas propuesto, dejó **9 altas en la semana (67 → 76)**, 15 compartidos y 1.560 de alcance: el mejor registro de la cuenta. El mecanismo funciona y la palanca es la red. > **Corrección del 21/9/2026 (Joana): los 1.000 seguidores no son un objetivo de crecimiento.** Son > una meta interna y aspiracional para antes de fin de año. **Se deja de dividir 1.000 por las altas > de la semana** — la cuenta de \"faltan 103 semanas, harían falta 72 por semana\" describe una meta > que no existe y convierte la mejor semana de la historia de la cuenta en un fracaso aritmético. > Ver `contexto/boxer-taller.md`. Lo que queda abierto no es si sirve, sino **cuántos colaborativos se pueden coordinar por mes** — pregunta de agenda, no de contenido. Sin la vara de los 1.000, la forma correcta de medirlo es comparar una semana con colaborativo contra una sin, no contra un número."}, {"pregunta": "¿El reel es lo que mueve el alcance de esta cuenta?", "estado_y_evidencia": "Perdió fuerza en la W38: la mejor semana de alcance orgánico de la historia de la cuenta —1.575 personas, +285,1%— llegó **sin publicar un solo reel**, con un carrusel. La evidencia a favor sigue siendo solo la W36 (220 de los 367 de alcance orgánico, y el de humor del 31/8 con view rate de 48,8%), y no quedó desmentida porque no se probó; pero ya no es la mejor explicación disponible. Lo que movió el alcance esta vez fue **quién distribuyó la pieza**, no en qué formato estaba. Antes de seguir invirtiendo en reel por el alcance, conviene separar las dos cosas: un reel sin colaborativo y un colaborativo sin reel. **W40, primera mitad de la prueba:** el reel del Expomecánico del 1/10, sin colaborativo, fue la pieza de mayor alcance de la semana (560, view rate 43,6%) y el bloque reel se llevó 773 de los 1.106 de alcance orgánico, mientras los dos carruseles de pilar quedaron en 32 y 34. Suma a favor, pero el reel hablaba de un evento con sorteo encima: falta un reel de pilar, sin evento ni colaborativo."}, {"pregunta": "¿El sorteo con condición de seguir trae altas que se quedan?", "estado_y_evidencia": "Abierta por la W40. Con el sorteo de entradas para el Expomecánico (\"Comentá EXPO y seguinos\", cierre el 1/10) la cuenta pasó de 80 a 121 (+41), la mejor semana de su historia, y el salto fue de 84 el 30/9 a 110 el 1/10. No se puede atribuir a la pieza (los reels no traen follows), pero la coincidencia es fuerte. Lo que hay que ver es **si se quedan**: si la W41 y la W42 no devuelven las altas, el sorteo trajo talleristas; si caen, trajo cazadores de sorteos. Hasta que no se vea, no se repite como palanca de crecimiento. **W42: las altas se quedaron.** Dos semanas después la cuenta está en 130 (121 al cierre del sorteo, 129 en la W41, 130 en la W42): no hubo caída. Con el criterio que se fijó, el sorteo no trajo cazadores de sorteos que se van. Lo que todavía no se sabe es si son talleristas: el dato de quién es cada seguidor no lo da Metricool."}, {"pregunta": "¿Los hashtags suman alcance?", "estado_y_evidencia": "Abierta el 23/9/2026 (consulta C1), sin lectura posible todavía: son 10 piezas (4 con hashtags, 6 sin) y la cuenta está en modo lanzamiento. La mediana con hashtags (117 contra 35) la arrastra el colaborativo de Rojas (1.560), cuyo alcance lo trajo quien lo distribuyó; en posts la mediana queda en 38 contra 26 de alcance: ruido. Mismo faltante que en Gestión: no hay alcance por origen en Metricool. Detalle en `data/hashtags/analisis.json`."}]}}}</script>

<div class="page">

</div>
<div id="tip" hidden></div>

<script>
const D = JSON.parse(document.getElementById("datos").textContent);
const $ = id => document.getElementById(id);
const fmt = (v, d = 0) => v == null ? "sin dato" : Number(v).toLocaleString("es-AR", {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = v => v == null ? "sin dato" : fmt(v, 1) + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const corta = s => s.replace(/^\d{4}-/, "");
const dm = iso => iso ? `${iso.slice(8,10)}/${iso.slice(5,7)}` : "";
const fechaPz = f => f ? `${f.slice(6,8)}/${f.slice(4,6)}` : "";

/* ---------- gráficos SVG (una escala por gráfico, marcas finas, tooltip) ---------- */
let W = 300; const H = 130, PL = 40, PR = 8, PT = 12, PB = 22;
function escala(max){ const m = max <= 0 ? 1 : max; const p = Math.pow(10, Math.floor(Math.log10(m))); return Math.ceil(m / p * 2) / 2 * p; }
function ejes(max){
  const top = escala(max), y = v => PT + (H - PT - PB) * (1 - v / top);
  let g = "";
  [0, top / 2, top].forEach(v => { g += `<line class="grid" x1="${PL}" x2="${W - PR}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${PL - 5}" y="${y(v) + 4}" text-anchor="end">${fmt(v, v < 10 && v % 1 ? 1 : 0)}</text>`; });
  return {g, y};
}
function xs(n){ const w = W - PL - PR; return i => PL + (n === 1 ? w / 2 : w * (i + .5) / n); }
function etiquetasX(labels, x){ const paso = Math.max(1, Math.ceil(labels.length / 6)); return labels.map((l, i) => ((labels.length - 1 - i) % paso === 0) ? `<text class="ax" x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(l)}</text>` : "").join(""); }

function linea(labels, vals, color, opts = {}){
  const ok = vals.filter(v => v != null);
  if (!ok.length) return '<p class="muted">sin dato</p>';
  const mn = Math.min(...ok), mx = Math.max(...ok), pad = Math.max((mx - mn) * .25, 1), lo = Math.max(0, mn - pad), hi = mx + pad;
  const y = v => PT + (H - PT - PB) * (1 - (v - lo) / (hi - lo || 1)), x = xs(labels.length);
  let g = "";
  [lo, (lo + hi) / 2, hi].forEach(v => { g += `<line class="grid" x1="${PL}" x2="${W - PR}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${PL - 5}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`; });
  const pts = vals.map((v, i) => v == null ? null : [x(i), y(v)]);
  let d = "", abierto = false;
  pts.forEach(p => { if (!p) { abierto = false; return; } d += (abierto ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); abierto = true; });
  const marcas = pts.map((p, i) => p ? `<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="transparent" data-tip="${esc(labels[i] + " · " + fmt(vals[i]) + " seguidores")}"/>` : "").join("");
  const fin = pts.map((p, i) => [p, i]).filter(a => a[0]).pop();
  const lab = `<circle cx="${fin[0][0]}" cy="${fin[0][1]}" r="4" fill="${color}"/><text class="val" x="${fin[0][0]}" y="${fin[0][1] - 9}" text-anchor="end">${fmt(vals[fin[1]])}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || "")}">${g}<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>${lab}${marcas}${etiquetasX(labels, x)}</svg>`;
}

function apiladas(labels, a, b, opts = {}){
  const tot = labels.map((_, i) => (a[i] || 0) + (b[i] || 0)), {g, y} = ejes(Math.max(...tot)), x = xs(labels.length);
  const bw = Math.max(2, Math.min(22, (W - PL - PR) / labels.length * .62));
  let barras = "";
  labels.forEach((l, i) => {
    if (a[i] == null && b[i] == null) return;
    const ya = y(a[i] || 0), yb = y((a[i] || 0) + (b[i] || 0)), y0 = y(0);
    barras += `<g class="bar" data-tip="${esc(`${l} · orgánico ${fmt(a[i])} · pauta ${fmt(b[i])}`)}"><rect x="${x(i) - bw / 2}" y="${ya}" width="${bw}" height="${Math.max(y0 - ya, 0)}" fill="var(--org)" rx="1.5"/>`
      + `<rect x="${x(i) - bw / 2}" y="${yb}" width="${bw}" height="${Math.max(ya - yb - 1.5, 0)}" fill="var(--pago)" rx="1.5"/>`
      + `<rect x="${x(i) - bw / 2 - 2}" y="${PT}" width="${bw + 4}" height="${y0 - PT}" fill="transparent"/></g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || "")}">${g}${barras}${etiquetasX(labels, x)}</svg>`;
}

function barras(labels, vals, opts = {}){
  const {g, y} = ejes(Math.max(...vals, 1)), x = xs(labels.length);
  const bw = Math.min(22, (W - PL - PR) / labels.length * .65);
  const b = labels.map((l, i) => {
    const color = opts.color ? opts.color(i) : "var(--org)";
    const lab = vals[i] > 0 ? `<text class="val" x="${x(i)}" y="${y(vals[i]) - 4}" text-anchor="middle">${vals[i]}</text>` : "";
    return `<g class="bar" data-tip="${esc(opts.tip ? opts.tip(i) : l + " · " + vals[i])}"><rect x="${x(i) - bw / 2}" y="${y(vals[i])}" width="${bw}" height="${Math.max(y(0) - y(vals[i]), vals[i] ? 1 : 0)}" fill="${color}" rx="2"/>${lab}<rect x="${x(i) - bw / 2 - 3}" y="${PT}" width="${bw + 6}" height="${y(0) - PT}" fill="transparent"/></g>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || "")}">${g}${b}${etiquetasX(labels, x)}</svg>`;
}

function delta(v, suf = ""){ if (v == null) return '<span class="muted">sin dato</span>'; const c = v > 0 ? "up" : v < 0 ? "down" : ""; return `<span class="${c}">${v > 0 ? "+" : ""}${fmt(v, suf === " pp" || (v % 1) ? 1 : 0)}${suf}</span>`; }

/* ---------- 1. las cuentas hoy ---------- */
function cuentas(){
  const G = D.general;
  if (!G) { $("cuentas").innerHTML = '<div class="card"><p class="muted">Todavía no hay números diarios de las cuentas.</p></div>'; return; }
  if (!G.al_dia) $("atraso").innerHTML = `<div class="atraso" role="alert"><b>Números de las cuentas sin actualizar desde el ${dm(G.datos_hasta)}.</b> Metricool no respondió en las últimas corridas: lo que ves abajo no es de hoy.</div>`;
  $("cuentas-sub").textContent = `últimos 7 días, del ${dm(G.ventana.desde)} al ${dm(G.ventana.hasta)}, contra los 7 anteriores`;
  $("cuentas").innerHTML = Object.values(G.marcas).map(m => {
    if (m.sin_dato) return `<div class="card"><h3>${m.nombre}</h3><p class="muted">Sin dato: ${esc(m.sin_dato)}.</p></div>`;
    const u = m.ultimos_7, v = m.variacion_pct, s = m.serie_30d, labels = s.map(p => dm(p.fecha));
    const otras = [];
    if (u.fb) otras.push(`<span>Facebook <b>${fmt(u.fb.seguidores)}</b> seguidores (${delta(u.fb.seguidores_delta)} en 7 días) · <b>${fmt(u.fb.views)}</b> views</span>`);
    if (u.li) otras.push(`<span>LinkedIn <b>${fmt(u.li.seguidores)}</b> seguidores (${delta(u.li.seguidores_delta)}) · <b>${fmt(u.li.impresiones)}</b> impresiones</span>`);
    const raro = u.engagement_no_confiable || u.muestra_chica;
    return `<div class="card">
      <h3>${m.nombre}</h3>
      <div class="kpis">
        <div class="kpi"><span class="k">Seguidores en Instagram</span><span class="v num">${fmt(u.seguidores)}</span><span class="d">${delta(u.seguidores_delta)} en 7 días · ${delta(m.seguidores_delta_30d)} en 30</span></div>
        <div class="kpi"><span class="k">Alcance, últimos 7 días</span><span class="v num">${fmt(u.alcance_total)}</span><span class="d">orgánico ${fmt(u.alcance_organico)} (${delta(v.alcance_organico, "%")}) · pauta ${fmt(u.alcance_pago)}</span></div>
        <div class="kpi"><span class="k">Engagement orgánico, 7 días</span><span class="v num">${pct(u.engagement_pct)}</span><span class="d">${fmt(u.interacciones)} interacciones · ${delta(v.engagement_pp, " pp")} contra los 7 anteriores</span>${raro ? `<span class="flag">${u.muestra_chica ? "muestra chica: el % es ruido" : "no confiable: arrastre de piezas viejas"}</span>` : ""}</div>
      </div>
      <div class="charts dos">
        <div class="ch"><span class="ct">Seguidores en Instagram, 30 días</span>${linea(labels, s.map(p => p.seguidores), "var(--org)", {aria: "Seguidores por día"})}</div>
        <div class="ch"><span class="ct">Alcance por día, 30 días</span>${apiladas(labels, s.map(p => p.alcance_organico), s.map(p => p.alcance_pago), {aria: "Alcance orgánico y pago por día"})}
          <div class="legend"><span><i style="background:var(--org)"></i>orgánico</span><span><i style="background:var(--pago)"></i>pauta</span></div></div>
      </div>
      <div class="otras">${otras.join("")}</div>
    </div>`;
  }).join("");
}

/* ---------- 2. leads ---------- */
function leads(){
  const L = D.leads, [act, prev] = L.trimestres;
  const tramo = prev.mismo_tramo, var_ = tramo.total ? Math.round((act.total - tramo.total) / tramo.total * 1000) / 10 : null;
  const unidas = [];
  [...prev.por_semana.map(w => ({...w, q: prev.etiqueta})), ...act.por_semana.map(w => ({...w, q: act.etiqueta}))]
    .forEach(w => { const u = unidas.find(x => x.semana === w.semana); u ? (u.leads += w.leads, u.q += " / " + w.q) : unidas.push({...w}); });
  const svg = (() => { W = 620; const r = barras(unidas.map(w => corta(w.semana)), unidas.map(w => w.leads), {aria: "Leads de redes por semana", color: i => unidas[i].q.includes(act.etiqueta) ? "var(--org)" : "var(--pago)", tip: i => `${unidas[i].semana} (${unidas[i].q}) · ${unidas[i].leads} leads`}); W = 300; return r; })();
  $("leads").innerHTML = `
    <div style="display:flex;flex-direction:column;gap:10px">
      <span class="eyebrow">${act.etiqueta}${act.en_curso ? " · en curso" : ""}</span>
      <span class="big num">${act.total}</span>
      <span class="sub">leads del ${dm(act.desde)} al ${dm(act.hasta)} · contra ${tramo.total} en el mismo tramo del ${prev.etiqueta}${var_ != null ? ` (${var_ > 0 ? "+" : ""}${fmt(var_, 1)}%)` : ""}</span>
      <div class="estados"><span class="chip">derivados ${act.derivados}</span><span class="chip">en gestión ${act.en_gestion}</span><span class="chip">no útiles ${act.no_utiles}</span><span class="chip">inactivos ${act.inactivos}</span></div>
      <span class="sub">${prev.etiqueta} completo: <b class="num">${prev.total}</b> leads · ${prev.derivados} derivados</span>
      <p class="nota">${esc(L.fuente)}. Datos al ${dm(L.corte_snapshot)}. Son leads del canal: no se atribuyen a ninguna publicación.</p>
    </div>
    <div class="ch"><span class="ct">Leads de redes por semana</span>${svg}
      <div class="legend"><span><i style="background:var(--pago)"></i>${prev.etiqueta}</span><span><i style="background:var(--org)"></i>${act.etiqueta}</span></div></div>`;
}

/* ---------- 3. la última semana ---------- */
function piezas(m){
  if (!m || !m.top_engagement.length) return '<p class="muted">Sin piezas publicadas.</p>';
  return `<div class="tw"><table><thead><tr><th>Pieza</th><th>Alcance</th><th>Interacciones</th><th>Engagement</th><th>Follows</th></tr></thead><tbody>${
    m.top_engagement.map(p => `<tr><td><div class="pz"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.tipo)} del ${fechaPz(p.fecha)}</a><small>${esc(p.texto)}</small></div></td><td>${fmt(p.alcance)}</td><td>${fmt(p.interacciones)}</td><td>${pct(p.engagement_pct)}</td><td>${p.follows == null ? '<span class="muted">sin dato</span>' : fmt(p.follows)}</td></tr>`).join("")
  }</tbody></table></div>`;
}
function semana(){
  const f = D.semana;
  if (!f) { $("semana-c").innerHTML = '<p class="muted">Todavía no hay una semana medida.</p>'; return; }
  const lec = f.lectura || {};
  $("semana-sub").textContent = `${f.semana}, del ${dm(f.desde)} al ${dm(f.hasta)} · se reemplaza cada lunes`;
  const lista = (t, items, color) => items && items.length ? `<div class="lista"><h3><span class="dot" style="background:${color}"></span>${t}</h3><ul>${items.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
  const cuerpo = lec.funciono || lec.no_funciono
    ? `<div class="listas">${lista("Qué funcionó", lec.funciono, "var(--good)")}${lista("Qué no funcionó", lec.no_funciono, "var(--bad)")}</div>`
    : (lec.puntos ? `<div class="lista"><h3>Lectura de la semana</h3><ul>${lec.puntos.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "");
  const crm = f.crm ? `<div class="crm">
      <div><span class="v num">${f.crm.prospectos_redes ?? "sin dato"}</span><span class="k">prospectos de redes en la semana${f.crm.var_pct != null ? ` (${f.crm.var_pct > 0 ? "+" : ""}${fmt(f.crm.var_pct, 1)}%)` : ""}</span></div>
      <div><span class="v num">${f.crm.inversion_redes_ars == null ? "sin dato" : "$ " + fmt(f.crm.inversion_redes_ars)}</span><span class="k">gasto en awareness de Meta (ARS)</span></div>
      <div><span class="v num">${f.crm.costo_por_prospecto_ars == null ? "sin dato" : "$ " + fmt(f.crm.costo_por_prospecto_ars)}</span><span class="k">costo por prospecto (ARS)</span></div></div>` : '<p class="muted">Sin cruce con el CRM para esta semana.</p>';
  const al = f.alertas.length ? `<div class="alertas"><h3>Alertas</h3><ul>${f.alertas.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
  $("semana-c").innerHTML = `${lec.titular ? `<p class="titular">${esc(lec.titular)}</p>` : '<p class="muted">Sin lectura escrita para esta semana.</p>'}
    ${cuerpo}${al}
    <div class="stack">${Object.values(f.marcas).map(m => `<div style="display:flex;flex-direction:column;gap:8px;min-width:0"><h3>${m.nombre}: el contenido más exitoso</h3>${piezas(m)}</div>`).join("")}</div>
    ${crm}`;
}

const G = D.general;
$("sub").textContent = G ? `Cuentas al ${dm(G.datos_hasta)} · leads al ${dm(D.leads.corte_snapshot)}${D.semana ? ` · última semana cerrada ${D.semana.semana}` : ""}` : "";
cuentas(); leads(); semana();
$("pie").textContent = `Métricas de Metricool y prospectos de Bitrix. Los números de las cuentas se actualizan todos los días (hasta el día anterior: el de hoy no cerró). La semana se mide una sola vez, el lunes después del cierre. Orgánico y pauta van separados: lo que se dice del contenido sale del orgánico. Generado ${D.generado.slice(0, 10).split("-").reverse().join("/")}.`;

const tip = $("tip");
document.addEventListener("pointermove", e => {
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (!t) { tip.hidden = true; return; }
  tip.textContent = t.getAttribute("data-tip"); tip.hidden = false;
  const w = tip.offsetWidth, x = Math.min(Math.max(8, e.clientX - w / 2), innerWidth - w - 8);
  tip.style.left = x + "px"; tip.style.top = (e.clientY - tip.offsetHeight - 12) + "px";
});
</script>
