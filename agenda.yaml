# Agenda de Lupa.
#
# Sumar un análisis = agregar un bloque acá. La rutina no se toca:
# `que_toca_hoy.py` lee este archivo y decide.
#
# Campos de cada análisis:
#   dias:          "todos" o lista de días en castellano (lunes, martes, ...).
#   artefacto:     clave del panel en paneles.yaml (ahí están los links oficial y de ensayo).
#   herramientas:  última parte del nombre de cada herramienta (sin el prefijo del conector,
#                  que en la rutina puede venir como un código). Se buscan con ToolSearch y
#                  cuentan si aparece una herramienta cuyo nombre termina en `__<sufijo>`.
#                  Si falta alguna después de 3 búsquedas, el análisis se marca fallido.
#   slack:         dónde se avisa el resultado.
#   disparar_despues: agentes (de `agentes`, abajo) cuya rutina se dispara cuando el análisis
#                  termina `ok`. Si termina fallido no se dispara y se avisa. Cómo: `disparo.py`.
#                  Orbi y Turbo todavía no existen.
#   necesita:      preparaciones (abajo) que tienen que correr antes, una sola vez por día
#                  aunque las usen varios análisis.
#   entorno:       variables de entorno que tienen que existir (nunca se muestran).
#   Lupa no lee el repo de ningún otro agente: lo que viene de otro agente llega por su parte.
#   procedimiento: los pasos del análisis.

zona_horaria: America/Argentina/Buenos_Aires

# Intentos por análisis por día. Al llegar al tope: aviso por Slack y no se
# reintenta hasta el día siguiente.
max_intentos_por_dia: 3

# Toda corrida manda un mensaje a Slack (regla 5): esto se verifica siempre.
herramientas_siempre:
  - slack_send_message

# Mientras paneles.yaml diga `modo: ensayo`, todo lo que va a Slack va a este DM con
# "[ensayo]" adelante, para no duplicar en el canal del equipo lo que mandan las rutinas viejas.
slack_ensayo: "D0BRVS7A4A3"

# El resumen de cierre de cada corrida (regla 5) va siempre a este DM de Joana. En oficial,
# sin "[ensayo]" (Joana, 08/10/2026). Los avisos de cada análisis van a su `slack`.
slack_resumen: "D0BRVS7A4A3"

# Rutinas de otros agentes que Lupa dispara (fire_trigger) cuando un análisis con
# `disparar_despues` termina ok. `texto` es lo que va en el disparo; lo arma `disparo.py`.
agentes:
  conti:
    rutina: "Conti · planificación"
    trigger_id: "trig_01WJUXuorZ5W7948yNGHU85c"
    # semana_plan: la ISO que empieza hoy; semana_cerrada: la que midió redes_semana.
    texto: "Planificar {semana_plan} · semana cerrada {semana_cerrada}"
    # Probado el 13/10/2026 con "PRUEBA DE DISPARO": Conti respondió en el DM.

# Pasos compartidos. Corren una vez por día, antes del primer análisis que los
# necesita, y su resultado queda en el parte bajo "preparacion".
preparaciones:
  gasto_meta:
    descripcion: Refresco del gasto diario de Meta (data/meta_spend.json y data/meta_adsets.json)
    procedimiento: procedimientos/gasto_meta.md
    herramientas:
      - ads_get_ad_entities
    # Si falla tras los reintentos, los análisis corren igual: el Monitor muestra
    # solo "Gasto de Meta sin actualizar desde <fecha>".

analisis:
  funnel:
    descripcion: Funnel de adquisición (leads → demos → ventas) desde Bitrix
    dias: todos
    artefacto: monitor_growth
    procedimiento: CLAUDE.md (sección Funnel)
    necesita: [gasto_meta]
    entorno: [BITRIX_WEBHOOK_URL]   # Bitrix entra por webhook, no por conector
    herramientas: []
    slack: "#adqui-notificaciones-canales"
    disparar_despues: []      # futuro: [orbi]

  meta:
    descripcion: Guardia diaria de Meta Ads + Panel Meta Ads (solo lectura)
    dias: todos
    artefacto: panel_meta_ads
    procedimiento: procedimientos/meta.md
    necesita: [gasto_meta]
    entorno: [BITRIX_WEBHOOK_URL]
    herramientas:
      - ads_get_ad_entities
      - ads_get_errors
      - ads_get_creatives
      - ads_get_ad_accounts
      - ads_account_get_activity_logs   # cambios en la cuenta
      - slack_read_channel          # re-ingresos de #adqui-automatizaciones
    slack: "#adqui-notificaciones-canales"
    disparar_despues: []      # futuro: [turbo]

  inversion:
    descripcion: Carga del gasto de Meta y Google Ads al SPA 1052 de Bitrix (única escritura permitida)
    dias: [lunes, jueves]
    artefacto: null
    procedimiento: procedimientos/inversion.md
    entorno: [BITRIX_WEBHOOK_URL, GOOGLE_ADS_CLIENT_ID, GOOGLE_ADS_CLIENT_SECRET,
              GOOGLE_ADS_REFRESH_TOKEN, GOOGLE_ADS_CUSTOMER_ID, GOOGLE_ADS_LOGIN_CUSTOMER_ID]
    herramientas:
      - ads_get_ad_entities
    slack: "#adqui-notificaciones-canales"   # la tabla de lo cargado, como la rutina vieja
    disparar_despues: []

  redes_semana:
    descripcion: Semana cerrada en Metricool (una sola vez, el lunes) + cruce con el CRM + conclusiones
    dias: [lunes]
    artefacto: panel_redes
    procedimiento: procedimientos/redes_semana.md
    entorno: [BITRIX_WEBHOOK_URL]
    herramientas:
      - getBrandSettings
      - getAnalyticsDataByMetrics
      - ads_get_ad_entities         # gasto de awareness de la semana
    slack: "D0BRVS7A4A3"
    disparar_despues: [conti]

  redes_general:
    descripcion: Seguidores, alcance y engagement al día de hoy + leads de redes del trimestre
    dias: todos
    artefacto: panel_redes
    procedimiento: procedimientos/redes_general.md
    entorno: [BITRIX_WEBHOOK_URL]
    herramientas:
      - getAnalyticsDataByMetrics
    slack: "D0BRVS7A4A3"
    disparar_despues: []

  limpieza:
    descripcion: Limpieza del histórico (crudos 8 semanas; fotos diarias del CRM 90 días y después una por semana)
    dias: [lunes]
    artefacto: null
    procedimiento: CLAUDE.md (sección Histórico y limpieza)
    herramientas: []
    slack: "D0BRVS7A4A3"
    disparar_despues: []
