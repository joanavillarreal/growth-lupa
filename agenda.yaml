# Agenda de Lupa.
#
# Sumar un análisis = agregar un bloque acá. La rutina no se toca:
# `que_toca_hoy.py` lee este archivo y decide.
#
# Campos de cada análisis:
#   dias:          "todos" o lista de días en castellano (lunes, martes, ...).
#   artefacto:     clave del panel en paneles.yaml (ahí están los links oficial y de ensayo).
#   herramientas:  última parte del nombre de cada herramienta (sin el prefijo del conector,
#                  que en la rutina puede venir como un código). Se buscan con ToolSearch y
#                  cuentan si aparece una herramienta cuyo nombre termina en `__<sufijo>`.
#                  Si falta alguna después de 3 búsquedas, el análisis se marca fallido.
#   slack:         dónde se avisa el resultado.
#   disparar_despues: agentes a los que se les pasa el parte al terminar.
#                  Vacío por ahora: Orbi, Turbo y Conti todavía no existen.
#   necesita:      preparaciones (abajo) que tienen que correr antes, una sola vez por día
#                  aunque las usen varios análisis.
#   entorno:       variables de entorno que tienen que existir (nunca se muestran).

zona_horaria: America/Argentina/Buenos_Aires

# Intentos por análisis por día. Al llegar al tope: aviso por Slack y no se
# reintenta hasta el día siguiente.
max_intentos_por_dia: 3

# Pasos compartidos. Corren una vez por día, antes del primer análisis que los
# necesita, y su resultado queda en el parte bajo "preparacion".
preparaciones:
  gasto_meta:
    descripcion: Refresco del gasto diario de Meta (data/meta_spend.json y data/meta_adsets.json)
    procedimiento: procedimientos/gasto_meta.md
    herramientas:
      - ads_get_ad_entities
    # Si falla tras los reintentos, los análisis corren igual: el Monitor muestra
    # solo "Gasto de Meta sin actualizar desde <fecha>".

analisis:
  funnel:
    descripcion: Funnel de adquisición (leads → demos → ventas) desde Bitrix
    dias: todos
    artefacto: monitor_growth
    necesita: [gasto_meta]
    entorno: [BITRIX_WEBHOOK_URL]   # Bitrix entra por webhook, no por conector
    herramientas: []
    slack: "#adqui-notificaciones-canales"
    disparar_despues: []      # futuro: [orbi]

  meta:
    descripcion: Lectura de la cuenta de Meta Ads (solo lectura, nada de cambios)
    dias: todos
    artefacto: panel_meta_ads
    necesita: [gasto_meta]
    herramientas:             # se ajusta en el paso 3
      - ads_get_ad_accounts
      - ads_get_ad_entities
    slack: "#adqui-notificaciones-canales"
    disparar_despues: []      # futuro: [turbo]

  redes:
    descripcion: Semana cerrada en redes (Metricool) + leads de redes en Bitrix
    dias: [lunes]
    artefacto: panel_redes
    herramientas:             # se ajusta en el paso 4
      - getBrandSettings
      - getAnalyticsDataByMetrics
    slack: "D0BRVS7A4A3"
    disparar_despues: []      # futuro: [conti]
