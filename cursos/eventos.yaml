# Eventos del canal educativo (cursos, webinars y charlas) que monitorea Lupa.
#
# Un bloque por evento, con la clave = carpeta en cursos/eventos/<slug>/ (ahí vive su
# dashboard.json, lo que se ve en Cursos en Vivo). Los datos los pasa Vent cuando define el
# evento (procedimientos/eventos.md); Lupa no los inventa ni los saca del repo de Vent.
#
# Campos:
#   nombre, tipo (curso | webinar | charla), fechas (una por clase), hora
#   apertura:  día en que se abre la inscripción. Antes de esa fecha el evento está "por abrir".
#   objetivos: inscriptos_min y derivacion_pct_min (los del canal: más de 40 y más del 15%).
#   planilla:  ID del Google Sheet de inscriptos (hoja "Inscriptos").
#   origen_crm / source_id: el origen propio del evento en Bitrix.
#   meta:      cuenta y campañas dedicadas al evento (solo esas; nunca campañas generales
#              como «JY | Cursos y Webinars»). Sin campañas: inversión null, no 0.
#   cerrado:   fecha en que Vent pidió cerrarlo. Un evento cerrado no se monitorea más.
#
# Estado, calculado por cursos/monitoreo.py contra la fecha de hoy:
#   por_abrir           hoy < apertura
#   inscripcion_abierta apertura <= hoy <= última fecha del evento
#   realizado           pasó la última fecha y no tiene `cerrado`
#   cerrado             tiene `cerrado`
# Lupa corre el monitoreo y republica el panel solo si hay alguno en los tres primeros.

